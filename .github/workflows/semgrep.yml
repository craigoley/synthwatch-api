name: Semgrep

on:
  push:
    branches: [main]
  # ★ NO `branches:` FILTER ON pull_request — DELIBERATE, DO NOT ADD ONE BACK. With `branches: [main]`
  #   this gate did not run at all on a PR targeting a non-main base, so a STACKED PR displayed no gate
  #   run and read to a reviewer as gated while asserting nothing. See scripts/check-pr-trigger-coverage.sh.
  pull_request:
  schedule:
    # Weekly, off-peak: Mondays 05:17 UTC.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install via pipx (preinstalled on ubuntu-latest, glibc) rather than the Alpine
      # semgrep container — JS actions like upload-sarif can't run node under musl.
      - name: Install Semgrep
        run: pipx install semgrep==1.167.0

      - name: Run Semgrep (SARIF)
        # Findings should surface in code scanning, not hard-fail the build.
        continue-on-error: true
        run: >-
          semgrep scan
          --config p/default
          --config p/security-audit
          --config p/csharp
          --sarif --output semgrep.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
