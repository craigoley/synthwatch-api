name: Dependency scan

on:
  push:
    branches: [main]
  # ★ NO `branches:` FILTER ON pull_request — DELIBERATE, DO NOT ADD ONE BACK. With `branches: [main]`
  #   this gate did not run at all on a PR targeting a non-main base, so a STACKED PR displayed no gate
  #   run and read to a reviewer as gated while asserting nothing. See scripts/check-pr-trigger-coverage.sh.
  pull_request:
  schedule:
    # Weekly, off-peak: Mondays 05:47 UTC.
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerable-packages:
    name: dotnet list package --vulnerable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Check for vulnerable packages (incl. transitive)
        run: |
          set -euo pipefail
          # Native NuGet vulnerability audit (GitHub Advisory DB), full transitive closure.
          dotnet list package --vulnerable --include-transitive --format json > vuln.json
          cat vuln.json
          count=$(jq '[.projects[]?.frameworks[]?.topLevelPackages[]?, .projects[]?.frameworks[]?.transitivePackages[]?] | length' vuln.json)
          echo "Vulnerable packages found: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::Found $count vulnerable package(s). See the JSON output above."
            exit 1
          fi
