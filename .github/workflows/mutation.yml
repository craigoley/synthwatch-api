name: Mutation gate (Stryker)

# Mutation-tests the two highest-risk pure-logic files — TrustReportProjection (the trust chip + flake
# budget) and ErrorDiff (the fingerprint + net-status severity chain the never-auto-suppress safety property
# rests on). Fails below `thresholds.break` in stryker-config.json (a floor DERIVED from a measured run, not
# invented — see the PR that introduced this). ci-gate aggregates this, so a regression in test strength on
# these files holds the merge. Scoped to two files so a per-PR run stays bounded.
#
# ★ COST SPLIT (mirrors the runner's PR-scoped mutation gate, adapted to Stryker.NET's native --since):
#   • PULL_REQUEST → `--since:origin/<the PR's OWN base>`: mutate ONLY the gated files this PR changed. A PR
#     touching neither TrustReportProjection.cs nor ErrorDiff.cs runs 0 mutants (instant); one that touches a
#     gated file runs only its changed portion. No weekly-full cron — at 7 min core-only it wouldn't earn the
#     cadence machinery; add it later only if drift appears.
#   • PUSH to main → FULL run (no --since): the post-merge full sweep IS the drift catch, already paid after
#     merge with no PR waiting on it. This is what lets us skip the weekly split.
#   ★ Fail-safe: an unresolvable --since ref makes Stryker.NET ERROR (fail-closed → job fails → merge held),
#     never a silent 0-mutant pass. fetch-depth:0 + an explicit fetch of the base keep the merge-base present.
#
# ★★ THE DIFF BASE IS THE PR'S OWN BASE, NOT A HARDCODED `main` — and this is the ONE gate in this repo that
#    genuinely misbehaved once the trigger was widened to non-main bases. It read `--since:origin/main`, so on
#    a STACKED PR (base = another feature branch) the diff-vs-main window also covers everything the BASE
#    branch changed. Stryker would then mutate code this PR never touched and could fail it on the base PR's
#    surviving mutants — a red naming files absent from the diff, which is worse than not running: it teaches
#    people the gate is noise. `github.base_ref` is the PR's real base, so the window is this PR's own changes
#    on any base, and is byte-identical to the old behaviour on a main-based PR.
on:
  push:
    branches: [main]
  # ★ NO `branches:` FILTER ON pull_request — DELIBERATE, DO NOT ADD ONE BACK. With `branches: [main]`
  #   this gate did not run at all on a PR targeting a non-main base, so a STACKED PR displayed no gate
  #   run and read to a reviewer as gated while asserting nothing. See scripts/check-pr-trigger-coverage.sh.
  pull_request:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # --since needs full history + the base ref to compute the diff base
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install Stryker.NET
        run: dotnet tool install -g dotnet-stryker
      - name: Run mutation gate (PR → --since the PR's own base; push → full)
        working-directory: tests/SynthWatch.Api.Tests
        env:
          BASE_REF: ${{ github.base_ref }}   # the PR's REAL base — 'main' on a normal PR, the parent branch on a stacked one
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fail CLOSED rather than silently falling back to main: an empty base_ref would make the window
            # wrong in the same direction the hardcoded 'main' was, and a wrong window is a wrong red.
            [ -n "$BASE_REF" ] || { echo "::error::github.base_ref is empty on a pull_request event — refusing to guess a diff base"; exit 1; }
            # Ensure the diff base is present as a remote-tracking ref (checkout fetches the PR ref, not the base).
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            echo "PR: mutating only gated files changed vs origin/${BASE_REF} (0 mutants if neither changed)"
            dotnet-stryker "--since:origin/${BASE_REF}"
          else
            echo "push to main: full run over the 2 gated files (post-merge drift catch)"
            dotnet-stryker
          fi
